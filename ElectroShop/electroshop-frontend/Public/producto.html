<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop - Producto</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div class="container">
        <div id="alerta" class="alert"></div>

        <button class="btn btn-outline btn-sm mb-1" data-action="volver">← Volver</button>

        <!-- ====== DETALLE DEL PRODUCTO ====== -->
        <div id="contenido" class="card">
            <p class="text-muted text-center">Cargando producto...</p>
        </div>

        <!-- ====== PRODUCTOS RELACIONADOS ====== -->
        <div id="zonaRelacionados" class="hidden">
            <h3 style="margin:1.5rem 0 0.75rem">🔗 Productos Relacionados</h3>
            <div id="gridRelacionados" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:1.5rem;"></div>
        </div>

        <!-- ====== RESEÑAS ====== -->
        <div id="zonaResenas" style="margin-top:1.5rem">
            <h3 style="margin:1.5rem 0 0.75rem">⭐ Reseñas y calificaciones</h3>
            <div id="contenidoResenas"><p class="text-muted">Cargando reseñas...</p></div>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/public/producto.js"></script>

</body>

</html>
