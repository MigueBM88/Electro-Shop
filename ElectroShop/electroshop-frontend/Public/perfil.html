<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop - Mi Perfil</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div class="container">
        <div id="alerta" class="alert"></div>

        <!-- ====== MODO VER ====== -->
        <div id="vistaVer">
            <div class="card">
                <div class="card-header" style="text-align:left">
                    <h2>👤 Mi Perfil</h2>
                    <p>Tu información personal en ElectroShop</p>
                </div>

                <div class="profile-field"><span class="label">Nombre</span><span id="vNombre">—</span></div>
                <div class="profile-field"><span class="label">Correo</span><span id="vCorreo">—</span></div>
                <div class="profile-field"><span class="label">Teléfono</span><span id="vTelefono">—</span></div>
                <div class="profile-field"><span class="label">Provincia</span><span id="vProvincia">—</span></div>
                <div class="profile-field"><span class="label">Cantón</span><span id="vCanton">—</span></div>
                <div class="profile-field"><span class="label">Distrito</span><span id="vDistrito">—</span></div>
                <div class="profile-field"><span class="label">Dirección</span><span id="vDetalle">—</span></div>
                <div class="profile-field"><span class="label">Rol</span><span id="vRol">—</span></div>
                <div class="profile-field"><span class="label">Miembro desde</span><span id="vFecha">—</span></div>

                <div class="btn-group">
                    <button class="btn btn-primary" data-action="activar-edicion">✏️ Editar Perfil</button>
                </div>
            </div>
        </div>

        <!-- ====== MODO EDITAR ====== -->
        <div id="vistaEditar" class="hidden">
            <div class="card">
                <div class="card-header" style="text-align:left">
                    <h2>✏️ Editar Perfil</h2>
                    <p>Modifica tu información personal</p>
                </div>

                <form id="formEditar">
                    <div class="form-group">
                        <label>Nombre completo</label>
                        <input type="text" id="eNombre">
                    </div>
                    <div class="form-group">
                        <label>Teléfono (8 dígitos)</label>
                        <input type="text" id="eTelefono" maxlength="8" placeholder="88887777">
                    </div>
                    <div class="form-group">
                        <label>Provincia</label>
                        <input type="text" id="eProvincia" placeholder="Ej: San José">
                    </div>
                    <div class="form-group">
                        <label>Cantón</label>
                        <input type="text" id="eCanton" placeholder="Ej: Central">
                    </div>
                    <div class="form-group">
                        <label>Distrito</label>
                        <input type="text" id="eDistrito" placeholder="Ej: Carmen">
                    </div>
                    <div class="form-group">
                        <label>Dirección detallada</label>
                        <input type="text" id="eDetalle" placeholder="100m norte de...">
                    </div>

                    <div class="btn-group">
                        <button type="button" class="btn btn-outline" data-action="cancelar-edicion">Cancelar</button>
                        <button type="submit" class="btn btn-primary" id="btnGuardar">Guardar cambios</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/public/perfil.js"></script>

</body>

</html>
