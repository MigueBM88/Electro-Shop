<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop - Registro</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <div class="icon">🔌</div>
                <h2>Crear Cuenta</h2>
                <p>Únete a ElectroShop</p>
            </div>

            <div id="alerta" class="alert"></div>

            <form id="formRegistro">
                <div class="form-group">
                    <label for="nombre">Nombre completo</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Miguel Bravo" required>
                    <div class="error-text" id="err-nombre"></div>
                </div>
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" name="correo" placeholder="tu@correo.com" required>
                    <div class="error-text" id="err-correo"></div>
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" name="contrasena" placeholder="Mínimo 8 caracteres" required>
                    <div class="error-text" id="err-contrasena"></div>
                </div>
                <div class="form-group">
                    <label for="confirmarContrasena">Confirmar contraseña</label>
                    <input type="password" id="confirmarContrasena" name="confirmarContrasena" placeholder="Repite tu contraseña" required>
                    <div class="error-text" id="err-confirmarContrasena"></div>
                </div>
                <button type="submit" class="btn btn-primary" id="btnReg">Registrarse</button>
            </form>

            <p class="text-center text-muted mt-1">
                ¿Ya tienes cuenta? <a href="index.html" class="text-link">Inicia sesión</a>
            </p>
        </div>
    </div>

    <!-- jQuery + jQuery Validation -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jquery-validation@1.20.0/dist/jquery.validate.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/public/registro.js"></script>

</body>

</html>
