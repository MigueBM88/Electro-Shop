<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop - Catálogo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>

    <div class="container">
        <div id="alerta" class="alert"></div>

        <!-- Spinner de carga (se muestra con mostrarSpinner / ocultarSpinner) -->
        <div id="cargando" class="cargando-contenedor d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
        </div>
        <!-- ====== VISTA: CATEGORÍAS PRINCIPALES ====== -->
        <div id="vistaCategorias">
            <h2 style="margin-bottom:0.5rem">🛍️ Catálogo de Componentes Electrónicos</h2>
            <p class="text-muted mb-1">Selecciona una categoría para explorar los productos</p>
            <div id="gridCategorias" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:1rem;">
                <p class="text-muted">Cargando categorías...</p>
            </div>
        </div>

        <!-- ====== VISTA: PRODUCTOS DE UNA CATEGORÍA ====== -->
        <div id="vistaProductos" class="hidden">
            <button class="btn btn-outline btn-sm mb-1" data-action="volver-categorias">← Volver a categorías</button>
            <h2 id="tituloCategoria" style="margin-bottom:0.5rem"></h2>

            <!-- Subcategorías -->
            <div id="gridSubcats" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:1rem;margin-bottom:1.5rem;"></div>

            <!-- Productos -->
            <div id="gridProductos" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:1.5rem;"></div>
            <div id="paginacion" class="text-center text-muted mt-1"></div>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/public/catalogo.js"></script>

</body>

</html>
