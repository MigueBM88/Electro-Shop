<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop - Catálogo</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>

    <div class="container">
        <div id="alerta" class="alert"></div>

        <!-- Spinner de carga (se muestra con mostrarSpinner / ocultarSpinner) -->
        <div id="cargando" class="cargando-contenedor d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
        </div>
        <!-- ====== VISTA: CATEGORÍAS PRINCIPALES ====== -->
        <div id="vistaCategorias">
            <!-- Hero (inspirado en la plantilla "heroes") -->
            <section class="es-hero">
                <div class="es-hero-texto">
                    <span class="es-hero-tag">⚡ Nuevos y reacondicionados</span>
                    <h1>Componentes para tus proyectos de electrónica</h1>
                    <p>Arduino, sensores, módulos y más. Envíos a todo Costa Rica y crédito por tus equipos usados con Trade-In.</p>
                    <form class="es-hero-busqueda" action="buscar.html" method="get" role="search">
                        <label for="heroBusqueda" class="visually-hidden">Buscar productos</label>
                        <input type="search" id="heroBusqueda" name="q" placeholder="Busca un componente, marca o SKU...">
                        <button type="submit" class="btn btn-primary">Buscar</button>
                    </form>
                </div>
                <div class="es-hero-visual" aria-hidden="true">🔌</div>
            </section>

            <!-- Destacados (inspirado en la plantilla "carousel") -->
            <section id="zonaDestacados" class="es-destacados hidden" aria-label="Productos destacados">
                <div class="es-seccion-head">
                    <h2>⭐ Productos destacados</h2>
                    <div class="es-carousel-ctrl">
                        <button type="button" class="es-carousel-btn" data-carousel="prev" aria-label="Anterior">‹</button>
                        <button type="button" class="es-carousel-btn" data-carousel="next" aria-label="Siguiente">›</button>
                    </div>
                </div>
                <div id="carouselDestacados" class="es-carousel" tabindex="0"></div>
            </section>

            <div class="es-seccion-head">
                <h2>🛍️ Explora por categoría</h2>
            </div>
            <div id="gridCategorias" class="es-grid-categorias">
                <p class="text-muted">Cargando categorías...</p>
            </div>
        </div>

        <!-- ====== VISTA: PRODUCTOS DE UNA CATEGORÍA ====== -->
        <div id="vistaProductos" class="hidden">
            <button class="btn btn-outline btn-sm mb-1" data-action="volver-categorias">← Volver a categorías</button>
            <h2 id="tituloCategoria" style="margin-bottom:0.5rem"></h2>

            <!-- Subcategorías -->
            <div id="gridSubcats" class="es-grid-subcats"></div>

            <!-- Productos -->
            <div id="gridProductos" class="es-grid-productos"></div>
            <div id="paginacion" class="text-center text-muted mt-1"></div>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/public/catalogo.js"></script>

</body>

</html>
