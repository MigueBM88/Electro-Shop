<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <div class="icon">🔌</div>
                <h2>ElectroShop</h2>
                <p>Inicia sesión en tu cuenta</p>
            </div>

            <div id="alerta" class="alert"></div>

            <form id="formLogin">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btnLogin">Iniciar Sesión</button>
            </form>

            <p class="text-center text-muted mt-1">
                ¿No tienes cuenta? <a href="registro.html" class="text-link">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script>
        // Si ya está logueado, redirigir
        if (estaLogueado()) window.location.href = 'perfil.html';

        document.getElementById('formLogin').addEventListener('submit', async function(e) {
            e.preventDefault();
            var btn = document.getElementById('btnLogin');
            var correo = document.getElementById('correo').value.trim();
            var contrasena = document.getElementById('contrasena').value;
            var alerta = document.getElementById('alerta');

            if (!correo || !contrasena) {
                alerta.textContent = 'Complete todos los campos';
                alerta.className = 'alert alert-error visible';
                return;
            }

            btn.disabled = true;
            btn.innerHTML = '<span class="spinner"></span> Ingresando...';

            try {
                var r = await apiLogin(correo, contrasena);

                if (r.exito) {
                    guardarSesion(r.datos.token, r.datos.usuario);
                    alerta.textContent = '✅ ' + r.mensaje;
                    alerta.className = 'alert alert-success visible';
                    setTimeout(function() {
                        window.location.href = r.datos.usuario.rol === 'admin' ? 'admin/usuarios.html' : 'perfil.html';
                    }, 800);
                } else {
                    var msg = r.mensaje;
                    if (r.minutosRestantes) msg += ' (' + r.minutosRestantes + ' min)';
                    if (r.intentosRestantes !== undefined) msg += ' — Intentos: ' + r.intentosRestantes;
                    alerta.textContent = msg;
                    alerta.className = 'alert alert-error visible';
                }
            } catch (err) {
                alerta.textContent = 'Error de conexión. ¿Está corriendo el backend?';
                alerta.className = 'alert alert-error visible';
            }

            btn.disabled = false;
            btn.innerHTML = 'Iniciar Sesión';
        });
    </script>

</body>

</html>
