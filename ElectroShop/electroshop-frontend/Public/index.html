<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop - Iniciar Sesión</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>

    <div class="auth-container">
        <div class="card">
            <div class="card-header">
                <div class="icon"><svg class="logo-chip" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="9" y="9" width="14" height="14" rx="2.5"/><path d="M13 4v5M19 4v5M13 23v5M19 23v5M4 13h5M4 19h5M23 13h5M23 19h5"/></svg></div>
                <h2>ElectroShop</h2>
                <p>Inicia sesión en tu cuenta</p>
            </div>

            <div id="alerta" class="alert"></div>

            <form id="formLogin">
                <div class="form-group">
                    <label for="correo">Correo electrónico</label>
                    <input type="email" id="correo" placeholder="tu@correo.com" required>
                </div>
                <div class="form-group">
                    <label for="contrasena">Contraseña</label>
                    <input type="password" id="contrasena" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary" id="btnLogin">Iniciar Sesión</button>
            </form>

            <p class="text-center text-muted mt-1">
                ¿No tienes cuenta? <a href="registro.html" class="text-link">Regístrate aquí</a>
            </p>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/public/index.js"></script>

</body>

</html>
