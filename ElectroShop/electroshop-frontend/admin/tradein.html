<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop Admin - Trade-In</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>

    <div class="container">
        <h2 style="margin-bottom:0.25rem">♻️ Evaluación de Trade-In</h2>
        <p class="text-muted mb-1">Revisa y evalúa las solicitudes de los clientes</p>
        <div id="alerta" class="alert"></div>

        <div class="filters-bar">
            <select id="fEstado">
                <option value="">Todas</option>
                <option value="solicitado">Solicitadas</option>
                <option value="en_revision">En revisión</option>
                <option value="aprobado">Aprobadas</option>
                <option value="rechazado">Rechazadas</option>
                <option value="contraoferta">Contraoferta</option>
            </select>
        </div>

        <!-- Spinner de carga (se muestra con mostrarSpinner / ocultarSpinner) -->
        <div id="cargando" class="cargando-contenedor d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
        </div>
        <div id="lista"><p class="text-muted">Cargando...</p></div>
    </div>

    <!-- MODAL EVALUAR -->
    <div id="modalEval" class="modal-overlay">
        <div class="modal" style="max-width:440px">
            <h3 id="evalTitulo">Evaluar solicitud</h3>
            <input type="hidden" id="evalId">
            <div class="form-group"><label>Decisión</label>
                <select id="evalEstado">
                    <option value="en_revision">En revisión</option>
                    <option value="aprobado">Aprobar</option>
                    <option value="contraoferta">Contraoferta</option>
                    <option value="rechazado">Rechazar</option>
                </select>
            </div>
            <div class="form-group"><label>Oferta de crédito (₡)</label><input type="number" id="evalOferta" min="0" placeholder="30000"></div>
            <div class="form-group"><label>Nota para el cliente</label><textarea id="evalNota" rows="2"></textarea></div>
            <div class="btn-group">
                <button class="btn btn-outline" data-action="cerrar-modal">Cancelar</button>
                <button class="btn btn-primary" id="btnGuardarEval" data-action="guardar-eval">Guardar evaluación</button>
            </div>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/admin/tradein.js"></script>
</body>

</html>
