<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop Admin - Categorías</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>

    <div class="container">
        <h2 style="margin-bottom:0.25rem">📂 Gestión de Categorías</h2>
        <p class="text-muted mb-1">Crea, edita y organiza las categorías del catálogo</p>

        <div id="alerta" class="alert"></div>

        <button class="btn btn-primary btn-sm mb-1" style="width:auto" data-action="nueva-categoria">+ Nueva Categoría</button>

        <!-- Spinner de carga (se muestra con mostrarSpinner / ocultarSpinner) -->
        <div id="cargando" class="cargando-contenedor d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
        </div>
        <!-- ====== ÁRBOL DE CATEGORÍAS ====== -->
        <div class="card">
            <div id="arbolCategorias">
                <p class="text-muted">Cargando categorías...</p>
            </div>
        </div>
    </div>

    <!-- ====== MODAL CREAR / EDITAR ====== -->
    <div id="modalCategoria" class="modal-overlay">
        <div class="modal">
            <h3 id="modalTitulo">Nueva Categoría</h3>
            <input type="hidden" id="modalCatId">
            <div class="form-group">
                <label>Nombre</label>
                <input type="text" id="catNombre" placeholder="Ej: Componentes Pasivos" required>
            </div>
            <div class="form-group">
                <label>Descripción (opcional)</label>
                <input type="text" id="catDescripcion" placeholder="Breve descripción">
            </div>
            <div class="form-group">
                <label>Ícono (emoji)</label>
                <input type="text" id="catIcono" placeholder="Ej: 🔌" maxlength="5" value="📦">
            </div>
            <div class="form-group">
                <label>Categoría padre (dejar vacío si es principal)</label>
                <select id="catPadre"><option value="">— Ninguna (categoría principal) —</option></select>
            </div>
            <div class="form-group">
                <label>Orden de visualización</label>
                <input type="number" id="catOrden" value="0" min="0">
            </div>
            <div class="form-group">
                <label>
          <input type="checkbox" id="catTradeIn"> Es categoría de Trade-In / Reacondicionados
        </label>
            </div>
            <div class="btn-group">
                <button class="btn btn-outline" data-action="cerrar-modal">Cancelar</button>
                <button class="btn btn-primary" id="btnGuardarCat" data-action="guardar-categoria">Guardar</button>
            </div>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/admin/categorias.js"></script>

</body>

</html>
