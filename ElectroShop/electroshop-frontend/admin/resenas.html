<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop Admin - Reseñas</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div class="container">
        <h2 style="margin-bottom:0.25rem">⭐ Moderación de Reseñas</h2>
        <p class="text-muted mb-1">Publica u oculta reseñas de los clientes</p>
        <div id="alerta" class="alert"></div>

        <div class="filters-bar">
            <select id="fEstado">
                <option value="">Todas</option>
                <option value="publicada">Publicadas</option>
                <option value="oculta">Ocultas</option>
            </select>
        </div>

        <div class="card">
            <div class="table-container">
                <table>
                    <thead><tr><th>Producto</th><th>Usuario</th><th>Calif.</th><th>Comentario</th><th>Estado</th><th>Acción</th></tr></thead>
                    <tbody id="tablaBody"><tr><td colspan="6" class="text-center text-muted">Cargando...</td></tr></tbody>
                </table>
            </div>
            <div id="paginacion" class="text-center text-muted mt-1"></div>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/admin/resenas.js"></script>
</body>

</html>
