<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop Admin - Reportes</title>
    <link rel="stylesheet" href="../css/styles.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>

<body>

    <div class="container">
        <h2 style="margin-bottom:0.25rem">📈 Reportes de Ventas</h2>
        <p class="text-muted mb-1">Panel de métricas e indicadores del negocio</p>
        <div id="alerta" class="alert"></div>

        <!-- KPIs -->
        <div id="kpis" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:1rem;margin-bottom:1.5rem"></div>

        <!-- Gráfico: ventas por día -->
        <div class="card" style="margin-bottom:1.5rem">
            <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem">
                <h3 style="margin:0">💰 Ingresos por día</h3>
                <select id="rango" onchange="cargarVentas()" style="width:auto">
                    <option value="7">Últimos 7 días</option>
                    <option value="30" selected>Últimos 30 días</option>
                    <option value="90">Últimos 90 días</option>
                </select>
            </div>
            <div style="height:300px;margin-top:1rem"><canvas id="chartVentas"></canvas></div>
        </div>

        <div style="display:grid;grid-template-columns:1fr 1fr;gap:1.5rem">
            <!-- Productos más vendidos -->
            <div class="card">
                <h3 style="margin-bottom:0.75rem">🏆 Productos más vendidos</h3>
                <div style="height:320px"><canvas id="chartProductos"></canvas></div>
            </div>
            <!-- Pedidos por estado -->
            <div class="card">
                <h3 style="margin-bottom:0.75rem">📦 Pedidos por estado</h3>
                <div style="height:320px"><canvas id="chartEstados"></canvas></div>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        if (!requiereAdmin()) throw 'no admin';
        renderNavbarAdmin('reportes');

        var charts = {};
        var COLORES = ['#2563eb', '#16a34a', '#f59e0b', '#dc2626', '#7c3aed', '#0891b2', '#db2777', '#65a30d'];

        async function cargarKpis() {
            var r = await apiReporteResumen();
            if (!r.exito) return;
            var k = r.datos.resumen;
            function card(titulo, valor, color) {
                return '<div class="card" style="text-align:center;padding:1rem">' +
                    '<div style="font-size:1.5rem;font-weight:700;color:' + (color || 'var(--primary)') + '">' + valor + '</div>' +
                    '<div class="text-muted" style="font-size:0.78rem">' + titulo + '</div></div>';
            }
            document.getElementById('kpis').innerHTML =
                card('Ingresos totales', formatPrecio(k.ingresos), 'var(--success)') +
                card('Pedidos (venta)', k.pedidosVenta) +
                card('Ticket promedio', formatPrecio(k.ticketPromedio)) +
                card('Total pedidos', k.totalPedidos) +
                card('Clientes', k.totalClientes) +
                card('Productos activos', k.totalProductos);
        }

        async function cargarVentas() {
            var dias = parseInt(document.getElementById('rango').value);
            var r = await apiReporteVentasPorDia(dias);
            if (!r.exito) return;
            var serie = r.datos.serie;
            var labels = serie.map(function(s) { return s.fecha.slice(5); }); // MM-DD
            var data = serie.map(function(s) { return s.ingresos; });

            if (charts.ventas) charts.ventas.destroy();
            charts.ventas = new Chart(document.getElementById('chartVentas'), {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Ingresos (₡)', data: data,
                        borderColor: '#2563eb', backgroundColor: 'rgba(37,99,235,0.1)',
                        fill: true, tension: 0.3, pointRadius: 3
                    }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        async function cargarProductos() {
            var r = await apiReporteProductosTop(8);
            if (!r.exito) return;
            var ps = r.datos.productos;
            if (charts.productos) charts.productos.destroy();
            charts.productos = new Chart(document.getElementById('chartProductos'), {
                type: 'bar',
                data: {
                    labels: ps.map(function(p) { return p.nombre.length > 20 ? p.nombre.slice(0, 20) + '…' : p.nombre; }),
                    datasets: [{ label: 'Unidades vendidas', data: ps.map(function(p) { return p.unidades; }), backgroundColor: '#16a34a' }]
                },
                options: { indexAxis: 'y', responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } } }
            });
        }

        async function cargarEstados() {
            var r = await apiReportePedidosPorEstado();
            if (!r.exito) return;
            var d = r.datos.distribucion;
            if (charts.estados) charts.estados.destroy();
            charts.estados = new Chart(document.getElementById('chartEstados'), {
                type: 'doughnut',
                data: {
                    labels: d.map(function(x) { return x.estado; }),
                    datasets: [{ data: d.map(function(x) { return x.total; }), backgroundColor: COLORES }]
                },
                options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { position: 'bottom' } } }
            });
        }

        cargarKpis();
        cargarVentas();
        cargarProductos();
        cargarEstados();
    </script>
</body>

</html>
