<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop Admin - Productos</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <!-- DataTables CSS -->
    <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">
</head>

<body>

    <div class="container">
        <header class="es-page-head">
            <h1>📦 Gestión de Productos</h1>
            <p>Crea, edita y administra los productos del catálogo</p>
        </header>

        <div id="alerta" class="alert"></div>

        <button class="btn btn-primary btn-sm mb-1" style="width:auto" data-action="nuevo-producto">+ Nuevo Producto</button>

        <div class="filters-bar">
            <select id="fCategoria"><option value="">Todas las categorías</option></select>
            <select id="fCondicion">
        <option value="">Todas las condiciones</option>
        <option value="nuevo">Nuevo</option>
        <option value="reacondicionado">Reacondicionado</option>
        <option value="poco_uso">Poco uso</option>
      </select>
            <select id="fActivo">
        <option value="">Todos</option>
        <option value="true">Activos</option>
        <option value="false">Inactivos</option>
      </select>
        </div>

        <!-- Spinner de carga (se muestra con mostrarSpinner / ocultarSpinner) -->
        <div id="cargando" class="cargando-contenedor d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
        </div>
        <!-- TABLA -->
        <div class="card">
            <div class="table-container">
                <table id="tablaProductos" class="display" style="width:100%">
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Condición</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Cargando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- MODAL CREAR / EDITAR -->
    <div id="modalProducto" class="modal-overlay">
        <div class="modal" style="max-width:600px">
            <h3 id="modalTitulo">Nuevo Producto</h3>
            <input type="hidden" id="modalProdId">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 1rem;">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="prodNombre" placeholder="Arduino Uno R3" required>
                </div>
                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" id="prodSku" placeholder="ARD-UNO-001">
                </div>
                <div class="form-group">
                    <label>Categoría *</label>
                    <select id="prodCategoria" required><option value="">Seleccionar...</option></select>
                </div>
                <div class="form-group">
                    <label>Marca</label>
                    <input type="text" id="prodMarca" placeholder="Arduino" value="Genérico">
                </div>
                <div class="form-group">
                    <label>Precio (₡) *</label>
                    <input type="number" id="prodPrecio" placeholder="15000" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Stock *</label>
                    <input type="number" id="prodStock" placeholder="50" min="0" required>
                </div>
                <div class="form-group">
                    <label>Condición</label>
                    <select id="prodCondicion">
            <option value="nuevo">Nuevo</option>
            <option value="reacondicionado">Reacondicionado</option>
            <option value="poco_uso">Poco uso</option>
          </select>
                </div>
                <div class="form-group">
                    <label>Precio original (si aplica)</label>
                    <input type="number" id="prodPrecioOriginal" placeholder="Solo para reacondicionados" min="0" step="0.01">
                </div>
            </div>

            <div class="form-group">
                <label>Descripción *</label>
                <textarea id="prodDescripcion" placeholder="Descripción detallada del producto..." rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>URL de Datasheet (PDF)</label>
                <input type="text" id="prodDatasheet" placeholder="https://...pdf">
            </div>
            <div class="form-group">
                <label>Especificaciones (una por línea: Nombre: Valor)</label>
                <textarea id="prodSpecs" placeholder="Voltaje: 5V&#10;Pines digitales: 14&#10;Pines analógicos: 6" rows="4"></textarea>
            </div>

            <div class="btn-group">
                <button class="btn btn-outline" data-action="cerrar-modal">Cancelar</button>
                <button class="btn btn-primary" id="btnGuardarProducto" data-action="guardar-producto">Guardar Producto</button>
            </div>
        </div>
    </div>

    <!-- jQuery + DataTables -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/admin/productos.js"></script>

</body>

</html>
