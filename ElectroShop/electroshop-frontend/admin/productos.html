<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop Admin - Productos</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>

<body>

    <div class="container">
        <h2 style="margin-bottom:0.25rem">📦 Gestión de Productos</h2>
        <p class="text-muted mb-1">Crea, edita y administra los productos del catálogo</p>

        <div id="alerta" class="alert"></div>

        <button class="btn btn-primary btn-sm mb-1" style="width:auto" onclick="abrirModalCrear()">+ Nuevo Producto</button>

        <div class="filters-bar">
            <input type="text" id="fBusqueda" placeholder="🔍 Buscar por nombre, SKU o marca...">
            <select id="fCategoria"><option value="">Todas las categorías</option></select>
            <select id="fCondicion">
        <option value="">Todas las condiciones</option>
        <option value="nuevo">Nuevo</option>
        <option value="reacondicionado">Reacondicionado</option>
        <option value="poco_uso">Poco uso</option>
      </select>
            <select id="fActivo">
        <option value="">Todos</option>
        <option value="true">Activos</option>
        <option value="false">Inactivos</option>
      </select>
        </div>

        <!-- TABLA -->
        <div class="card">
            <div class="table-container">
                <table>
                    <thead>
                        <tr>
                            <th>Producto</th>
                            <th>Categoría</th>
                            <th>Precio</th>
                            <th>Stock</th>
                            <th>Condición</th>
                            <th>Estado</th>
                            <th>Acciones</th>
                        </tr>
                    </thead>
                    <tbody id="tablaBody">
                        <tr>
                            <td colspan="7" class="text-center text-muted">Cargando...</td>
                        </tr>
                    </tbody>
                </table>
            </div>
            <div id="paginacion" class="text-center text-muted mt-1"></div>
        </div>
    </div>

    <!-- MODAL CREAR / EDITAR -->
    <div id="modalProducto" class="modal-overlay">
        <div class="modal" style="max-width:600px">
            <h3 id="modalTitulo">Nuevo Producto</h3>
            <input type="hidden" id="modalProdId">

            <div style="display:grid;grid-template-columns:1fr 1fr;gap:0 1rem;">
                <div class="form-group">
                    <label>Nombre *</label>
                    <input type="text" id="prodNombre" placeholder="Arduino Uno R3" required>
                </div>
                <div class="form-group">
                    <label>SKU</label>
                    <input type="text" id="prodSku" placeholder="ARD-UNO-001">
                </div>
                <div class="form-group">
                    <label>Categoría *</label>
                    <select id="prodCategoria" required><option value="">Seleccionar...</option></select>
                </div>
                <div class="form-group">
                    <label>Marca</label>
                    <input type="text" id="prodMarca" placeholder="Arduino" value="Genérico">
                </div>
                <div class="form-group">
                    <label>Precio (₡) *</label>
                    <input type="number" id="prodPrecio" placeholder="15000" min="0" step="0.01" required>
                </div>
                <div class="form-group">
                    <label>Stock *</label>
                    <input type="number" id="prodStock" placeholder="50" min="0" required>
                </div>
                <div class="form-group">
                    <label>Condición</label>
                    <select id="prodCondicion">
            <option value="nuevo">Nuevo</option>
            <option value="reacondicionado">Reacondicionado</option>
            <option value="poco_uso">Poco uso</option>
          </select>
                </div>
                <div class="form-group">
                    <label>Precio original (si aplica)</label>
                    <input type="number" id="prodPrecioOriginal" placeholder="Solo para reacondicionados" min="0" step="0.01">
                </div>
            </div>

            <div class="form-group">
                <label>Descripción *</label>
                <textarea id="prodDescripcion" placeholder="Descripción detallada del producto..." rows="3"></textarea>
            </div>
            <div class="form-group">
                <label>URL de Datasheet (PDF)</label>
                <input type="text" id="prodDatasheet" placeholder="https://...pdf">
            </div>
            <div class="form-group">
                <label>Especificaciones (una por línea: Nombre: Valor)</label>
                <textarea id="prodSpecs" placeholder="Voltaje: 5V&#10;Pines digitales: 14&#10;Pines analógicos: 6" rows="4"></textarea>
            </div>

            <div class="btn-group">
                <button class="btn btn-outline" onclick="cerrarModal()">Cancelar</button>
                <button class="btn btn-primary" onclick="guardarProducto()">Guardar Producto</button>
            </div>
        </div>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script>
        if (!requiereAdmin()) throw 'no admin';
        renderNavbarAdmin('productos');

        var paginaActual = 1;
        var timerBusqueda = null;

        // === Cargar selects de categorías ===
        async function cargarSelectCategorias() {
            try {
                var r = await apiArbolCategorias(true);
                if (r.exito) {
                    var selFiltro = document.getElementById('fCategoria');
                    var selModal = document.getElementById('prodCategoria');
                    r.datos.arbol.forEach(function(c) {
                        var id = c._id || c.id;
                        selFiltro.innerHTML += '<option value="' + id + '">' + (c.icono || '') + ' ' + c.nombre + '</option>';
                        selModal.innerHTML += '<option value="' + id + '">' + (c.icono || '') + ' ' + c.nombre + '</option>';
                        if (c.subcategorias) {
                            c.subcategorias.forEach(function(s) {
                                var sid = s._id || s.id;
                                selFiltro.innerHTML += '<option value="' + sid + '"> — ' + s.nombre + '</option>';
                                selModal.innerHTML += '<option value="' + sid + '"> — ' + s.nombre + '</option>';
                            });
                        }
                    });
                }
            } catch (e) { /* ignorar */ }
        }

        // === Cargar tabla de productos ===
        async function cargarProductos() {
            var params = '?pagina=' + paginaActual + '&limite=10';
            var busqueda = document.getElementById('fBusqueda').value.trim();
            var categoria = document.getElementById('fCategoria').value;
            var condicion = document.getElementById('fCondicion').value;
            var activo = document.getElementById('fActivo').value;

            if (busqueda) params += '&busqueda=' + encodeURIComponent(busqueda);
            if (categoria) params += '&categoria=' + categoria;
            if (condicion) params += '&condicion=' + condicion;
            if (activo) params += '&activo=' + activo;

            try {
                var r = await apiListarProductosAdmin(params);
                var tbody = document.getElementById('tablaBody');

                if (r.exito) {
                    var productos = r.datos.productos;

                    if (productos.length === 0) {
                        tbody.innerHTML = '<tr><td colspan="7" class="text-center text-muted">No se encontraron productos</td></tr>';
                        document.getElementById('paginacion').innerHTML = '';
                        return;
                    }

                    tbody.innerHTML = productos.map(function(p) {
                        var id = p._id || p.id;
                        var catNombre = (p.categoria && p.categoria.nombre) ? p.categoria.nombre : 'Sin categoría';
                        return '<tr>' +
                            '<td><strong>' + p.nombre + '</strong><br><span class="text-muted" style="font-size:0.75rem">' + (p.marca || '') + ' · SKU: ' + (p.sku || '—') + '</span></td>' +
                            '<td>' + catNombre + '</td>' +
                            '<td>' + formatPrecio(p.precio) + '</td>' +
                            '<td>' + stockBadge(p.stock) + '</td>' +
                            '<td>' + condicionBadge(p.condicion) + '</td>' +
                            '<td>' + estadoBadge(p.activo) + '</td>' +
                            '<td>' +
                            '<button class="btn btn-sm btn-primary" onclick="abrirModalEditar(\'' + id + '\')" style="margin-right:0.4rem;margin-bottom:0.3rem">Editar</button>' +
                            '<button class="btn btn-sm btn-danger" onclick="eliminarProd(\'' + id + '\',\'' + p.nombre.replace(/'/g, "\\'") + '\')">Eliminar</button>' +
                            '</td>' +
                            '</tr>';
                    }).join('');

                    // Paginación
                    var pag = r.datos.paginacion;
                    var pagHTML = 'Página ' + pag.pagina + ' de ' + pag.totalPaginas + ' (' + pag.total + ' productos) ';
                    if (pag.pagina > 1) pagHTML += '<button class="btn btn-sm btn-outline" onclick="irPagina(' + (pag.pagina - 1) + ')">← Anterior</button> ';
                    if (pag.pagina < pag.totalPaginas) pagHTML += '<button class="btn btn-sm btn-outline" onclick="irPagina(' + (pag.pagina + 1) + ')">Siguiente →</button>';
                    document.getElementById('paginacion').innerHTML = pagHTML;
                } else {
                    mostrarAlerta('alerta', 'error', r.mensaje);
                }
            } catch (e) {
                mostrarAlerta('alerta', 'error', 'Error de conexión');
            }
        }

        function irPagina(p) {
            paginaActual = p;
            cargarProductos();
        }

        // === Filtros ===
        document.getElementById('fBusqueda').addEventListener('input', function() {
            clearTimeout(timerBusqueda);
            timerBusqueda = setTimeout(function() {
                paginaActual = 1;
                cargarProductos();
            }, 400);
        });
        document.getElementById('fCategoria').addEventListener('change', function() {
            paginaActual = 1;
            cargarProductos();
        });
        document.getElementById('fCondicion').addEventListener('change', function() {
            paginaActual = 1;
            cargarProductos();
        });
        document.getElementById('fActivo').addEventListener('change', function() {
            paginaActual = 1;
            cargarProductos();
        });

        // === Modal Crear ===
        function abrirModalCrear() {
            document.getElementById('modalTitulo').textContent = 'Nuevo Producto';
            document.getElementById('modalProdId').value = '';
            document.getElementById('prodNombre').value = '';
            document.getElementById('prodSku').value = '';
            document.getElementById('prodCategoria').value = '';
            document.getElementById('prodMarca').value = 'Genérico';
            document.getElementById('prodPrecio').value = '';
            document.getElementById('prodStock').value = '';
            document.getElementById('prodCondicion').value = 'nuevo';
            document.getElementById('prodPrecioOriginal').value = '';
            document.getElementById('prodDescripcion').value = '';
            document.getElementById('prodDatasheet').value = '';
            document.getElementById('prodSpecs').value = '';
            document.getElementById('modalProducto').classList.add('visible');
        }

        // === Modal Editar ===
        async function abrirModalEditar(id) {
            try {
                var r = await apiProductoDetalle(id);
                if (!r.exito) {
                    mostrarAlerta('alerta', 'error', 'No se pudo cargar el producto');
                    return;
                }

                var p = r.datos.producto;
                document.getElementById('modalTitulo').textContent = 'Editar Producto';
                document.getElementById('modalProdId').value = id;
                document.getElementById('prodNombre').value = p.nombre || '';
                document.getElementById('prodSku').value = p.sku || '';
                document.getElementById('prodCategoria').value = (p.categoria && (p.categoria._id || p.categoria.id || p.categoria)) || '';
                document.getElementById('prodMarca').value = p.marca || 'Genérico';
                document.getElementById('prodPrecio').value = p.precio || '';
                document.getElementById('prodStock').value = p.stock || 0;
                document.getElementById('prodCondicion').value = p.condicion || 'nuevo';
                document.getElementById('prodPrecioOriginal').value = p.precioOriginal || '';
                document.getElementById('prodDescripcion').value = p.descripcion || '';
                document.getElementById('prodDatasheet').value = p.datasheetUrl || '';

                // Especificaciones a texto
                var specsTexto = '';
                if (p.especificaciones && p.especificaciones.length > 0) {
                    specsTexto = p.especificaciones.map(function(s) {
                        return s.nombre + ': ' + s.valor;
                    }).join('\n');
                }
                document.getElementById('prodSpecs').value = specsTexto;

                document.getElementById('modalProducto').classList.add('visible');
            } catch (e) {
                mostrarAlerta('alerta', 'error', 'Error de conexión');
            }
        }

        function cerrarModal() {
            document.getElementById('modalProducto').classList.remove('visible');
        }

        // === Guardar producto (crear o editar) ===
        async function guardarProducto() {
            var id = document.getElementById('modalProdId').value;

            var nombre = document.getElementById('prodNombre').value.trim();
            var categoria = document.getElementById('prodCategoria').value;
            var precio = document.getElementById('prodPrecio').value;
            var stock = document.getElementById('prodStock').value;
            var descripcion = document.getElementById('prodDescripcion').value.trim();

            if (!nombre || !categoria || !precio || stock === '' || !descripcion) {
                alert('Completa todos los campos obligatorios (*)');
                return;
            }

            // Parsear especificaciones
            var specsTexto = document.getElementById('prodSpecs').value.trim();
            var especificaciones = [];
            if (specsTexto) {
                specsTexto.split('\n').forEach(function(linea) {
                    var partes = linea.split(':');
                    if (partes.length >= 2) {
                        especificaciones.push({
                            nombre: partes[0].trim(),
                            valor: partes.slice(1).join(':').trim()
                        });
                    }
                });
            }

            var datos = {
                nombre: nombre,
                sku: document.getElementById('prodSku').value.trim(),
                categoria: categoria,
                marca: document.getElementById('prodMarca').value.trim() || 'Genérico',
                precio: parseFloat(precio),
                stock: parseInt(stock),
                condicion: document.getElementById('prodCondicion').value,
                descripcion: descripcion,
                datasheetUrl: document.getElementById('prodDatasheet').value.trim(),
                especificaciones: especificaciones
            };

            var precioOrig = document.getElementById('prodPrecioOriginal').value;
            if (precioOrig) datos.precioOriginal = parseFloat(precioOrig);

            try {
                var r;
                if (id) {
                    r = await apiEditarProducto(id, datos);
                } else {
                    r = await apiCrearProducto(datos);
                }

                if (r.exito) {
                    mostrarAlerta('alerta', 'success', '✅ ' + r.mensaje);
                    cerrarModal();
                    cargarProductos();
                } else {
                    mostrarAlerta('alerta', 'error', r.mensaje);
                }
            } catch (e) {
                mostrarAlerta('alerta', 'error', 'Error de conexión');
            }
        }

        // === Eliminar producto ===
        async function eliminarProd(id, nombre) {
            if (!confirm('¿Eliminar el producto "' + nombre + '"? Esta acción no se puede deshacer.')) return;

            try {
                var r = await apiEliminarProducto(id);
                if (r.exito) {
                    mostrarAlerta('alerta', 'success', '✅ ' + r.mensaje);
                    cargarProductos();
                } else {
                    mostrarAlerta('alerta', 'error', r.mensaje);
                }
            } catch (e) {
                mostrarAlerta('alerta', 'error', 'Error de conexión');
            }
        }

        // === Iniciar ===
        cargarSelectCategorias();
        cargarProductos();
    </script>

</body>

</html>
