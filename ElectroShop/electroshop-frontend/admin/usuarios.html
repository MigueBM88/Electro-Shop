
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ElectroShop Admin - Usuarios</title>
  <link rel="stylesheet" href="../css/styles.css">
  <link rel="icon" type="image/svg+xml" href="/favicon.svg">
  <!-- DataTables CSS -->
  <link rel="stylesheet" href="https://cdn.datatables.net/2.1.8/css/dataTables.dataTables.min.css">
</head>
<body>

  <div class="container">
    <h2 style="margin-bottom:0.25rem">👥 Gestión de Usuarios</h2>
    <p class="text-muted mb-1">Administra los usuarios registrados en ElectroShop</p>

    <div id="alerta" class="alert"></div>

    <!-- Filtros -->
    <div class="filters-bar">
            <select id="fRol">
        <option value="">Todos los roles</option>
        <option value="cliente">Cliente</option>
        <option value="admin">Admin</option>
        <option value="vendedor">Vendedor</option>
      </select>
      <select id="fActivo">
        <option value="">Todos los estados</option>
        <option value="true">Activos</option>
        <option value="false">Inactivos</option>
      </select>
    </div>

    <!-- Spinner de carga (se muestra con mostrarSpinner / ocultarSpinner) -->
    <div id="cargando" class="cargando-contenedor d-none">
      <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
    </div>
    <!-- Tabla -->
    <div class="card">
      <div class="table-container">
        <table id="tablaUsuarios" class="display" style="width:100%">
          <thead>
            <tr>
              <th>Nombre</th>
              <th>Correo</th>
              <th>Rol</th>
              <th>Estado</th>
              <th>Registro</th>
              <th>Acciones</th>
            </tr>
          </thead>
          <tbody id="tablaBody">
            
          </tbody>
        </table>
      </div>
          </div>
  </div>

  <!-- Modal Cambiar Rol -->
  <div id="modalRol" class="modal-overlay">
    <div class="modal">
      <h3>Cambiar Rol de Usuario</h3>
      <p class="text-muted mb-1" id="modalNombre"></p>
      <input type="hidden" id="modalUserId">
      <div class="form-group">
        <label>Nuevo rol</label>
        <select id="modalSelectRol">
          <option value="cliente">Cliente</option>
          <option value="admin">Admin</option>
          <option value="vendedor">Vendedor</option>
        </select>
      </div>
      <div class="btn-group">
        <button class="btn btn-outline" data-action="cerrar-modal">Cancelar</button>
        <button class="btn btn-primary" id="btnGuardarRol" data-action="confirmar-cambio-rol">Guardar</button>
      </div>
    </div>
  </div>

  <!-- jQuery + DataTables -->
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <script src="https://cdn.datatables.net/2.1.8/js/dataTables.min.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/utils.js"></script>
  <script src="../js/admin/usuarios.js"></script>

</body>
</html>
