<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop Vendedor - Mis Ventas</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>

    <div class="container">
        <header class="es-page-head">
            <h1>💰 Mis Ventas</h1>
            <p>Pedidos que incluyen tus productos</p>
        </header>
        <div id="alerta" class="alert"></div>

        <!-- Spinner de carga (se muestra con mostrarSpinner / ocultarSpinner) -->
        <div id="cargando" class="cargando-contenedor d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
        </div>
        <div id="totalVendido" class="card" style="text-align:center;max-width:300px;margin-bottom:1.5rem"></div>

        <div id="lista"><p class="text-muted">Cargando...</p></div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/estadoPedido.js"></script>
    <script src="../js/vendedor/ventas.js"></script>
</body>

</html>
