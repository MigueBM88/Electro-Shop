<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop - Trade-In</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>

    <div class="container">
        <h2 style="margin-bottom:0.25rem">♻️ Trade-In de equipos</h2>
        <p class="text-muted mb-1">Ofrece tu equipo usado y recibe crédito para tus compras</p>
        <div id="alerta" class="alert"></div>

        <div style="display:grid;grid-template-columns:400px 1fr;gap:1.5rem;align-items:start">
            <!-- Formulario de solicitud -->
            <div class="card">
                <h3 style="margin-bottom:0.75rem">Nueva solicitud</h3>
                <div class="form-group"><label>Equipo *</label><input type="text" id="nombreEquipo" placeholder="Osciloscopio Hantek DSO5102P"></div>
                <div class="form-group"><label>Descripción del estado *</label><textarea id="descripcion" rows="3" placeholder="Funciona perfecto, incluye puntas y caja original..."></textarea></div>
                <div class="form-group"><label>Condición</label>
                    <select id="condicion">
                        <option value="excelente">Excelente</option>
                        <option value="bueno" selected>Bueno</option>
                        <option value="regular">Regular</option>
                        <option value="para_repuestos">Para repuestos</option>
                    </select>
                </div>
                <div class="form-group"><label>Precio esperado (₡, opcional)</label><input type="number" id="precioEstimado" min="0" placeholder="35000"></div>
                <button class="btn btn-primary" id="btnEnviarTradein" data-action="enviar-tradein">Enviar solicitud</button>
            </div>

            <!-- Mis solicitudes -->
            <div>
                <h3 style="margin-bottom:0.75rem">Mis solicitudes</h3>
                <!-- Spinner de carga (se muestra con mostrarSpinner / ocultarSpinner) -->
                <div id="cargando" class="cargando-contenedor d-none">
                    <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
                </div>
                <div id="listaSolicitudes"><p class="text-muted">Cargando...</p></div>
            </div>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/public/tradein.js"></script>
</body>

</html>
