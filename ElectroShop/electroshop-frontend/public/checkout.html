<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ElectroShop - Pagar</title>
    <link rel="stylesheet" href="../css/styles.css">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>

<body>

    <div class="container">
        <button class="btn btn-outline btn-sm mb-1" style="width:auto" data-href="carrito.html">← Volver al carrito</button>
        <h2 style="margin-bottom:0.5rem">💳 Finalizar compra</h2>
        <div id="alerta" class="alert"></div>

        <!-- Spinner de carga (se muestra con mostrarSpinner / ocultarSpinner) -->
        <div id="cargando" class="cargando-contenedor d-none">
            <div class="spinner-border text-primary" role="status"><span class="visually-hidden">Cargando...</span></div>
        </div>
        <div id="contenido" style="display:grid;grid-template-columns:1fr 360px;gap:1.5rem;align-items:start">
            <p class="text-muted">Cargando...</p>
        </div>
    </div>

    <!-- jQuery (debe cargar antes de api.js, utils.js y scripts de página) -->
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/utils.js"></script>
    <script src="../js/public/checkout.js"></script>
</body>

</html>
